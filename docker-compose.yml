# ADR-022 — compose único com profiles.
# ADR-044 — Escala horizontal da API com Docker Compose.
#
#   infra (sem profile):        docker compose up -d
#   aplicação completa:         docker compose --profile app up -d
#   sistema + observabilidade:  docker compose --profile app --profile obs up -d
#   IA (Ollama):                docker compose --profile ai up -d   (ADR-041)
#   WhatsApp (Evolution API):   docker compose --profile evolution up -d   (ADR-059)
#
# ESCALA HORIZONTAL (ADR-044):
#   docker compose --profile app up -d --scale api=2
#   docker compose --profile app up -d --scale api=3
#   docker compose --profile app up -d --scale workers=2  (requer lock distribuído)
#
# ESCALA HORIZONTAL OLLAMA (ADR-041):
#   docker compose --profile ai up -d --scale ollama-1=3 (alterar IPs manualmente)
#
# DNS interno: os serviços se enxergam pelo nome do serviço (api, workers,
# seq, otel-collector, ollama-lb), não por localhost. O nginx usa upstream
# dinâmico com DNS round-robin do Docker para load balancing entre réplicas
# da API e do Ollama.

services:
  postgres:
    image: postgres:17-alpine
    container_name: infracontrol-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infracontrol}
      POSTGRES_USER: ${POSTGRES_USER:-infracontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infracontrol_dev_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infracontrol} -d ${POSTGRES_DB:-infracontrol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infracontrol

  # ADR-045: Redis Sentinel para alta disponibilidade
  redis-master:
    image: redis:7-alpine
    container_name: infracontrol-redis-master
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_2026}
    command: ["sh", "-c", "exec redis-server --appendonly yes --masterauth \"$${REDIS_PASSWORD}\" --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      infracontrol:
        ipv4_address: ${REDIS_MASTER_IP:-172.30.240.10}

  redis-slave:
    image: redis:7-alpine
    container_name: infracontrol-redis-slave
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_2026}
      REDIS_SLAVE_IP: ${REDIS_SLAVE_IP:-172.30.240.11}
    command: ["sh", "/etc/redis/redis-replica-entrypoint.sh"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    volumes:
      - redis_slave_data:/data
      - ./docker/redis-replica-entrypoint.sh:/etc/redis/redis-replica-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG && { redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" info replication | grep -q role:master || redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" info replication | grep -q master_link_status:up; }",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      infracontrol:
        ipv4_address: ${REDIS_SLAVE_IP:-172.30.240.11}

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: infracontrol-redis-sentinel-1
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_2026}
      REDIS_MASTER_IP: ${REDIS_MASTER_IP:-172.30.240.10}
    command: ["sh", "/etc/redis/redis-sentinel-entrypoint.sh"]
    volumes:
      - ./docker/redis-sentinel-entrypoint.sh:/etc/redis/redis-sentinel-entrypoint.sh:ro
      - redis_sentinel_1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "${REDIS_SENTINEL_PORT:-26379}:26379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" -p 26379 sentinel ckquorum mymaster | grep -q '^OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      infracontrol:
        ipv4_address: ${REDIS_SENTINEL_1_IP:-172.30.240.12}

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: infracontrol-redis-sentinel-2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_2026}
      REDIS_MASTER_IP: ${REDIS_MASTER_IP:-172.30.240.10}
    command: ["sh", "/etc/redis/redis-sentinel-entrypoint.sh"]
    volumes:
      - ./docker/redis-sentinel-entrypoint.sh:/etc/redis/redis-sentinel-entrypoint.sh:ro
      - redis_sentinel_2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "${REDIS_SENTINEL_2_PORT:-26380}:26379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" -p 26379 sentinel ckquorum mymaster | grep -q '^OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      infracontrol:
        ipv4_address: ${REDIS_SENTINEL_2_IP:-172.30.240.13}

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: infracontrol-redis-sentinel-3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_2026}
      REDIS_MASTER_IP: ${REDIS_MASTER_IP:-172.30.240.10}
    command: ["sh", "/etc/redis/redis-sentinel-entrypoint.sh"]
    volumes:
      - ./docker/redis-sentinel-entrypoint.sh:/etc/redis/redis-sentinel-entrypoint.sh:ro
      - redis_sentinel_3_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "${REDIS_SENTINEL_3_PORT:-26381}:26379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" -p 26379 sentinel ckquorum mymaster | grep -q '^OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      infracontrol:
        ipv4_address: ${REDIS_SENTINEL_3_IP:-172.30.240.14}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: infracontrol-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-infracontrol}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-infracontrol_dev_2026}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infracontrol

  adminer:
    image: adminer:latest
    container_name: infracontrol-adminer
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - infracontrol

  # ---------------- profile: app ----------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    image: infracontrol-api:dev
    profiles: ["app"]
    environment: &app-env
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=infracontrol;Username=${POSTGRES_USER:-infracontrol};Password=${POSTGRES_PASSWORD:-infracontrol_dev_2026}"
      ConnectionStrings__Redis: "redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379,serviceName=mymaster,password=${REDIS_PASSWORD:-redis_dev_password_2026},sentinelPassword=${REDIS_PASSWORD:-redis_dev_password_2026},abortConnect=false"
      ConnectionStrings__RabbitMQ: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER:-infracontrol}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-infracontrol_dev_2026}
      Serilog__WriteTo__0__Name: Console
      # Formato de índice, não "WriteTo__Seq": a chave nomeada "Seq" sem o
      # "Name" correspondente derruba o boot do Serilog.Settings.Configuration
      # (exit 139 em loop). O índice 1 é o sink Seq do appsettings; só o
      # serverUrl é trocado pelo nome interno do serviço.
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: http://seq:80
      OpenTelemetry__Endpoint: http://otel-collector:4317
      DataProtection__KeyRingPath: /app/var/data-protection-keys
      RemoteAccess__CredentialEncryption__Key: ${CREDENTIAL_ENCRYPTION_KEY:-3ewHa9GEGWR7P+141SZYke9RTS71FmBw36PESzVgR+k=}
      # F34-T007 / ADR-060 D2 — SSO do gateway: a API minta o token
      # server-to-server (header X-Remote-User) neste endpoint INTERNO.
      # Só alcançável na rede do compose; sem o profile `remote` o valor
      # permanece e o serviço cai → erro pt-BR explícito na ficha.
      RemoteAccess__Guacamole__BaseUrl: http://guacamole:8080/guacamole
      ProjectEvidence__StoragePath: var/project-evidence
      # Fase AI (ADR-041): base URL do Ollama DENTRO da rede do compose —
      # DNS por nome de serviço, nunca localhost entre containers (§48).
      # Consumido pelo AI Gateway (S3+); sem o profile `ai` a API sobe
      # normalmente com o runtime "não configurado" (§44) — o serviço é
      # opcional, por isso não há depends_on aqui.
      Ai__Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Fase A (ADR-050): providers externos — chave só via .env do
      # operador (AGENTS.md: nunca credencial real no repositório);
      # vazio = provider "não configurado" (§44) e a API sobe normal.
      Ai__OpenAiCompatible__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      Ai__OpenAiCompatible__ApiKey: ${OPENAI_API_KEY:-}
      Ai__Gemini__BaseUrl: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      Ai__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      # Gateway AI — timeout POR TENTATIVA (appsettings: 30s). Em CPU local
      # (qwen2.5-coder:1.5b) investigação/geração longas passam de 30s e,
      # com MaxRetries=1, 2×30s viram 502 (AiGatewayException). Operador
      # levanta via AI_GATEWAY_TIMEOUT no .env (padrão preserva 30s).
      Ai__Gateway__Timeout: ${AI_GATEWAY_TIMEOUT:-00:00:30}
      Authentication__Google__ClientId: ${VITE_GOOGLE_CLIENT_ID:-}
      # Bootstrap Admin (opt-in, idempotente; documentado em .env.example e
      # docs/05). Sem repassar aqui a chave nunca chega na API e o primeiro
      # deploy nasce sem usuário Admin — policy Administer fica 403 para
      # sempre. Enabled=false é o padrão: sem senha, sem boot quebrado.
      BootstrapAdmin__Enabled: ${BootstrapAdmin__Enabled:-false}
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:-admin@example.com}
      BootstrapAdmin__DisplayName: ${BootstrapAdmin__DisplayName:-InfraControl Admin}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:-}
      # Fase 0: repasse de integração/monitoramento/notificação que existiam só
      # no appsettings — sem aqui a action legada do Zabbix cai no 401 (Token
      # vazio) e o SnmpSystem roda com o default "public"/161 da engenharia,
      # invisível para quem só olha o .env.
      Integrations__Zabbix__Token: ${ZABBIX_TOKEN:-}
      # F20-T001/ADR-028: cliente REST do UniFi Controller — vazio = integração
      # desligada (credencial só via .env, nunca no repositório).
      Integrations__Unifi__BaseUrl: ${UNIFI_BASE_URL:-}
      Integrations__Unifi__Username: ${UNIFI_USERNAME:-}
      Integrations__Unifi__Password: ${UNIFI_PASSWORD:-}
      Integrations__Unifi__Site: ${UNIFI_SITE:-default}
      Monitoring__Snmp__Community: ${SNMP_COMMUNITY:-public}
      Monitoring__Snmp__Port: ${SNMP_PORT:-161}
      # F18-T005/ADR-042: serviços de rede em leitura (leases/rotas via SNMP,
      # ACLs via SSH por vendor). Target vazio = desligado (503 + motivo nos
      # endpoints /network/services/*); credencial SSH só via .env.
      NetworkServices__Target: ${NETWORK_SERVICES_TARGET:-}
      NetworkServices__Vendor: ${NETWORK_SERVICES_VENDOR:-cisco}
      NetworkServices__SshUsername: ${NETWORK_SERVICES_SSH_USER:-}
      NetworkServices__SshPassword: ${NETWORK_SERVICES_SSH_PASSWORD:-}
      NetworkServices__SshPort: ${NETWORK_SERVICES_SSH_PORT:-22}
      NetworkServices__TimeoutSeconds: ${NETWORK_SERVICES_TIMEOUT_SECONDS:-5}
      Notifications__Channels__Default__0: ${NOTIFY_DEFAULT_0:-Email}
      Notifications__Channels__Default__1: ${NOTIFY_DEFAULT_1:-SignalR}
      Notifications__Channels__Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}
      Notifications__Channels__WhatsApp__Phone: ${WHATSAPP_PHONE:-}
      Notifications__Channels__WhatsApp__GroupId: ${WHATSAPP_GROUP_ID:-}
      Notifications__Channels__WhatsApp__BaseUrl: ${EVOLUTION_BASE_URL:-}
      Notifications__Channels__WhatsApp__ApiKey: ${EVOLUTION_API_KEY:-}
      Notifications__Channels__WhatsApp__InstanceId: ${WHATSAPP_INSTANCE:-}
      Notifications__Channels__Webhook__Url: ${WEBHOOK_URL:-}
      Notifications__Channels__Webhook__Secret: ${WEBHOOK_SECRET:-}
      Notifications__Channels__Slack__Channel: ${SLACK_CHANNEL:-}
    # Imagem aspnet não traz curl/wget e /bin/sh é o dash (sem /dev/tcp):
    # healthcheck HTTP real passa por `bash -c` (bate em GET /health/ready e espera
    # 200) — porta aberta sozinha não prova boot. /health/ready filtra apenas
    # checks essenciais (tags "core"), ignorando ai-runtime que pode ser Degraded.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Storage de evidências do PDI (ADR-034, Fase 4): /app/var é gravável
      # só pelo UID não-root (chown no Dockerfile) e o volume nomeado herda
      # essa ownership na primeira montagem — arquivos sobrevivem a recreate.
      - pdi-evidence:/app/var/pdi-evidence
      - project-evidence:/app/var/project-evidence
      - api_data_protection:/app/var/data-protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-slave:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infracontrol

  workers:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: workers
    image: infracontrol-workers:dev
    profiles: ["app"]
    environment:
      <<: *app-env
      Backup__Path: /app/backups
      # F34-T003 (ADR-060): banco do gateway de acesso remoto incluído no
      # MESMO BackupWorker — prefixo próprio ("guacamole-*.dump") e
      # heartbeat "latest-guacamole.json" ao lado do latest.json principal.
      Backup__AdditionalTargets__0__ConnectionString: "Host=guacamole-db;Port=5432;Database=guacamole;Username=guacamole;Password=${GUACAMOLE_DB_PASSWORD:-guacamole_dev_password_2026}"
      Backup__AdditionalTargets__0__FileNamePrefix: guacamole
      UnifiSync__IntervalMinutes: ${UNIFI_SYNC_INTERVAL_MINUTES:-30}
    volumes:
      - postgres_backups:/app/backups
    # Worker não escuta porta; o sinal de saúde é a presença do processo.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f InfraControl.Workers >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-slave:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - infracontrol
      # F34-T003: workers entra em remote_access SOMENTE para alcançar
      # guacamole-db:5432 no pg_dump/pg_restore do alvo adicional do
      # backup (a rede foi fechada para o resto da plataforma no T002).
      - remote_access

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_BASE_URL: ""
        # Botão "plataforma de logs" da LogsPage; tem de bater com SEQ_UI_PORT
        # publicado pelo nginx (em produção, o host real + essa porta).
        VITE_LOGS_URL: ${VITE_LOGS_URL:-http://localhost:5341}
    image: infracontrol-frontend:dev
    profiles: ["app"]
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      # Rota PROVADA do Seq (nginx com basic auth) — o serviço `seq` em si
      # não publica porta nenhuma (ADR-022).
      - "${SEQ_UI_PORT:-5341}:5341"
    environment:
      # Porta HTTPS publicada no HOST — o redirect HTTP→HTTPS do nginx não tem
      # como deduzi-la (80→443, 8080→8443, 8085→8445); entra via envsubst.
      NGINX_HTTPS_PORT: ${HTTPS_PORT:-443}
      SEQ_AUTH_USER: ${SEQ_AUTH_USER:-admin}
      SEQ_AUTH_PASSWORD: ${SEQ_AUTH_PASSWORD:-admin}
    healthcheck:
      # nginx responde 301 (HTTP→HTTPS) na raiz; curl -f só falha em >=400.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - infracontrol

  # ---------------- profile: obs ----------------
  seq:
    image: datalust/seq:latest
    profiles: ["obs"]
    environment:
      ACCEPT_EULA: Y
      # Seq 2026.1 (datalust/seq:latest) aborta o boot sem senha de admin:
      # FTL "No default admin password was supplied" em crash-loop. Opt-out
      # oficial SEQ_FIRSTRUN_NOAUTHENTICATION (docs.datalust.co/docs/
      # environment-variables) preserva o comportamento anterior (Seq sem
      # login próprio) — a rota continua protegida pelo basic auth do nginx
      # (ADR-021/022, SEQ_AUTH_USER/PASSWORD). Só vale na 1ª inicialização.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq_data:/data
    restart: unless-stopped
    networks:
      - infracontrol

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["obs"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTLP_PORT:-4317}:4317"
    restart: unless-stopped
    networks:
      - infracontrol

  # ---------------- profile: zabbix (F18-T001) ----------------
  zabbix-db:
    image: postgres:17-alpine
    container_name: infracontrol-zabbix-db
    profiles: ["zabbix"]
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_dev_password_2026}
    ports:
      - "${ZABBIX_DB_PORT:-5433}:5432"
    volumes:
      - zabbix_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infracontrol

  zabbix-server:
    # F18-T001 (decisão do usuário 2026-10-03): 7.4.15 → 8.0 trunk (alpine-trunk,
    # próximo LTS com feedback positivo da comunidade no LinkedIn - HA nativo,
    # Postgres 18, ClickHouse, JSON nativo).
    image: zabbix/zabbix-server-pgsql:alpine-trunk
    container_name: infracontrol-zabbix-server
    profiles: ["zabbix"]
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_dev_password_2026}
      ZBX_HANODENAME: zabbix-server
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    volumes:
      - zabbix_server_snmptraps:/var/lib/zabbix/snmptraps
      - zabbix_server_mibs:/var/lib/zabbix/mibs
    depends_on:
      zabbix-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infracontrol

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-trunk
    container_name: infracontrol-zabbix-web
    profiles: ["zabbix"]
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_dev_password_2026}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      # 8086 (não 8085): 8085 é o HTTP_PORT do frontend do InfraControl
      - "${ZABBIX_WEB_PORT:-8086}:8080"
    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    # Healthcheck do frontend oficial do Zabbix (zabbix-docker
    # compose_zabbix_components.yaml): GET /ping.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - infracontrol

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-trunk
    container_name: infracontrol-zabbix-agent
    profiles: ["zabbix"]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: "Zabbix server"
    ports:
      - "${ZABBIX_AGENT_PORT:-10050}:10050"
    depends_on:
      zabbix-server:
        condition: service_started
    # compose oficial do Zabbix não define healthcheck para o agent; usa-se o
    # mesmo padrão de TCP do zabbix-server (agent2 alpine traz nc).
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10050 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - infracontrol

  # ---------------- profile: evolution (F33-T001 — ADR-059) ----------------
  # Evolution API v2 (WhatsApp) para levar eventos do Zabbix ao grupo da
  # empresa. Sobe só com: docker compose --profile evolution up -d.
  # A API do InfraControl NÃO depende deste profile (opt-in, espelho do `ai`):
  # sem ele, o canal WhatsApp fica no adaptador de logging (ADR-059 §4).
  # Imagem PINADA por tag (nunca latest): o contrato da Evolution muda entre
  # majors v1/v2 (ADR-059 §2). Credenciais só via .env (AGENTS.md).
  evolution-db:
    image: postgres:17-alpine
    container_name: infracontrol-evolution-db
    profiles: ["evolution"]
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME:-evolution}
      POSTGRES_USER: ${EVOLUTION_DB_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution_dev_password_2026}
    ports:
      - "${EVOLUTION_DB_PORT:-5435}:5432"
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVOLUTION_DB_USER:-evolution} -d ${EVOLUTION_DB_NAME:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infracontrol

  evolution-redis:
    image: redis:7-alpine
    container_name: infracontrol-evolution-redis
    profiles: ["evolution"]
    # appendonly: a Evolution guarda estado de sessão no Redis — AOF evita
    # perda de sessão a cada restart do container.
    command: ["sh", "-c", "exec redis-server --appendonly yes"]
    ports:
      - "${EVOLUTION_REDIS_PORT:-6380}:6379"
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infracontrol

  evolution-api:
    # ADR-059 §2 (spike F33-T001, 2026-10-18): a documentação da Evolution
    # aponta "atendai/evolution-api" — repositório INEXISTENTE no Docker Hub
    # (404). O repo oficial é evoapicloud/evolution-api; tag "latest" aponta
    # build mais antigo que v2.3.7 (por isso pinamos). v2.3.7 = última
    # estável v2 (2025-12-05); 2.4.0 é ainda RC. Atualizar tag = spike
    # refeito + este ADR revisado antes do deploy.
    image: evoapicloud/evolution-api:v2.3.7
    container_name: infracontrol-evolution-api
    profiles: ["evolution"]
    ports:
      - "${EVOLUTION_API_PORT:-8081}:8080"
    environment:
      # URL interna na rede do compose (§48): a API InfraControl chama
      # http://evolution-api:8080 — nunca localhost entre containers.
      SERVER_URL: http://evolution-api:8080
      SERVER_PORT: 8080
      # Header `apikey` exigido por toda chamada — mesmo valor consumido
      # pelo dispatcher (Notifications:Channels:WhatsApp:ApiKey).
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_dev_api_key_2026}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD:-evolution_dev_password_2026}@evolution-db:5432/${EVOLUTION_DB_NAME:-evolution}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: infracontrol_evolution
      # Só o que o canal de notificação precisa: persistir a instância.
      # Mensagens/contatos/chats desligados = banco enxuto (envio é saída,
      # não um bot de atendimento — ADR-059 §1).
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: infracontrol_evolution
      # Sessão WhatsApp no banco (não no Redis): sobrevive a restart do
      # cache sem novo QR.
      CACHE_REDIS_SAVE_INSTANCES: "false"
      # Sem RabbitMQ/S3: o repo já tem broker próprio e o canal envia só
      # texto (ADR-059 §1 — sem mídia).
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
      S3_ENABLED: "false"
      # F33-T001: DEBUG foi usado no spike para diagnosticar o loop da issue
      # #1408 (revertido em 2026-10-18). Manter INFO: com instância conectada
      # a N grupos, DEBUG infla o log do Docker sem controle.
      LOG_LEVEL: INFO
      LOG_COLOR: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    # Imagem node:24-alpine (busybox wget). Spike F33-T001 (2026-10-18): na
    # v2.3.7 NÃO existe /ping (404); a raiz "/" responde 200 sem autenticar
    # e sem redirect-hostile. Todo o resto exige header apikey (401 = OK).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - infracontrol

  # ---------------- profile: remote (Fase 34 — ADR-060) ----------------
  # Gateway de acesso remoto (Guacamole p/ RDP+SSH, decisão D1). Sobe com
  # `docker compose --profile remote up -d`. NENHUMA porta publicada no host:
  # acesso só via nginx (HTTPS /guacamole/) — padrão ADR-022 (Seq sem porta).
  # Propriedades validadas no spike das docs oficiais Guacamole v1.6.0
  # (F34-T002): convenção propriedade→UPPER com "_" + POSTGRESQL_ENABLED +
  # GUACD_HOSTNAME + HTTP_AUTH_ENABLED (header auth embutida na imagem).
  # Schema NÃO é auto-criado (docs): guacamole-init gera o SQL
  # (initdb.sh --postgresql) num volume e o postgres aplica em
  # /docker-entrypoint-initdb.d na PRIMEIRA subida (datadir vazio).

  guacamole-init:
    image: guacamole/guacamole:1.6.0
    container_name: infracontrol-guacamole-init
    profiles: ["remote"]
    # user root: a imagem roda non-root e o one-shot grava no volume nomeado
    # (raiz root-owned); só escreve o SQL e encerra.
    user: root
    command: ["/bin/sh", "-c", "/opt/guacamole/bin/initdb.sh --postgresql > /sql/initdb.sql"]
    volumes:
      - guacamole_init:/sql
    restart: "no"
    networks:
      - remote_access

  guacamole-db:
    image: postgres:17-alpine
    container_name: infracontrol-guacamole-db
    profiles: ["remote"]
    environment:
      POSTGRES_DB: guacamole
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: ${GUACAMOLE_DB_PASSWORD:-guacamole_dev_password_2026}
    volumes:
      - guacamole_db_data:/var/lib/postgresql/data
      - guacamole_init:/docker-entrypoint-initdb.d:ro
    depends_on:
      guacamole-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole -d guacamole"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - remote_access

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: infracontrol-guacd
    profiles: ["remote"]
    # Sem porta publicada:4822 só alcançável por guacamole (rede remote_access).
    # Egress para os alvos reais (LAN) sai pelo NAT do host — a regra de
    # firewall do host restringindo destinos permitidos é OBRIGATÓRIA antes do
    # piloto (F34-T003+; "destinos alcançáveis apenas a partir do gateway").
    restart: unless-stopped
    networks:
      - remote_access

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: infracontrol-guacamole
    profiles: ["remote"]
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_HOSTNAME: guacamole-db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_USER: guacamole
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD:-guacamole_dev_password_2026}
      # SSO (ADR-060 D2): extensão header auth embutida na imagem Docker.
      # ALERTA das docs Guacamole: o header DEVE ser saneado — só a
      # plataforma (server-to-server) pode defini-lo; o nginx limpa
      # X-Remote-User/REMOTE_USER de toda requisição externa (anti-spoofing).
      HTTP_AUTH_ENABLED: "true"
      HTTP_AUTH_HEADER: X-Remote-User
      # Sessão do gateway expira por inatividade (min) — Fase 6 refina.
      API_SESSION_TIMEOUT: "60"
    depends_on:
      guacamole-db:
        condition: service_healthy
      guacd:
        condition: service_started
    healthcheck:
      # Página de login no contexto padrão /guacamole/ (curl: base Ubuntu do
      # image temurin; ajustado empiricamente se ausente na primeira subida).
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/guacamole/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      # DMZ simples: guacamole é o ÚNICO membro em ambas as redes — nginx e
      # API alcançam via infracontrol; db e guacd só existem em remote_access.
      - infracontrol
      - remote_access

  # ---------------- profile: ai (Fase AI — ADR-041) ----------------
  # Runtime local de LLM da AI Foundation com escalabilidade horizontal.
  # Só sobe com --profile ai; a API NÃO depende dele (estado "não configurado"
  # quando ausente). Arquitetura: 3 réplicas do Ollama + nginx load balancer.
  # DNS interno: os serviços se enxergam pelo nome "ollama-lb", não localhost.

  ollama-1:
    image: ollama/ollama:latest
    container_name: infracontrol-ollama-1
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_1_data:/root/.ollama
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/11434 && printf 'GET /api/tags HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      infracontrol:
        ipv4_address: ${OLLAMA_1_IP:-172.30.240.20}

  ollama-2:
    image: ollama/ollama:latest
    container_name: infracontrol-ollama-2
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_2_data:/root/.ollama
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/11434 && printf 'GET /api/tags HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      infracontrol:
        ipv4_address: ${OLLAMA_2_IP:-172.30.240.21}

  ollama-3:
    image: ollama/ollama:latest
    container_name: infracontrol-ollama-3
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_3_data:/root/.ollama
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/11434 && printf 'GET /api/tags HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      infracontrol:
        ipv4_address: ${OLLAMA_3_IP:-172.30.240.22}

  ollama-lb:
    image: nginx:1.27-alpine
    container_name: infracontrol-ollama-lb
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT:-11434}:80"
    volumes:
      - ./docker/ollama-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ollama-1:
        condition: service_healthy
      ollama-2:
        condition: service_healthy
      ollama-3:
        condition: service_healthy
    # 127.0.0.1 e não localhost: o nginx do LB só escuta IPv4 (`listen 80`);
    # wget em localhost cai no ::1 e marca o container como unhealthy.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/tags"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - infracontrol


volumes:
  postgres_data:
  redis_master_data:
  redis_slave_data:
  redis_sentinel_1_data:
  redis_sentinel_2_data:
  redis_sentinel_3_data:
  rabbitmq_data:
  seq_data:
  zabbix_db_data:
  zabbix_server_snmptraps:
  zabbix_server_mibs:
  evolution_db_data:
  evolution_redis_data:
  evolution_instances:
  ollama_1_data:
  ollama_2_data:
  ollama_3_data:
  pdi-evidence:
  project-evidence:
  api_data_protection:
  postgres_backups:
  guacamole_db_data:
  guacamole_init:

networks:
  infracontrol:
    driver: bridge
    ipam:
      config:
        - subnet: ${INFRACONTROL_NETWORK_SUBNET:-172.30.240.0/24}
          ip_range: ${INFRACONTROL_DYNAMIC_IP_RANGE:-172.30.240.128/25}
  # F34-T002 (ADR-060): rede restrita do gateway de acesso remoto —
  # guacamole-db e guacamole-guacd vivem SÓ aqui; guacamole é o único
  # membro também presente em infracontrol. Não internal:true porque o
  # guacd precisa de egress p/ LAN (restrito por firewall do host).
  remote_access:
    driver: bridge