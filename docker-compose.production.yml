# Production overlay for the single-host Docker Compose deployment.
# Configure every required value in the untracked .env before using this file.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPUS:?Set POSTGRES_CPUS for this host}
          memory: ${POSTGRES_MEMORY:?Set POSTGRES_MEMORY for this host}

  redis-master:
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPUS:?Set REDIS_CPUS for this host}
          memory: ${REDIS_MEMORY:?Set REDIS_MEMORY for this host}

  redis-slave:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: ${REDIS_CPUS:?Set REDIS_CPUS for this host}
          memory: ${REDIS_MEMORY:?Set REDIS_MEMORY for this host}

  redis-sentinel-1:
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: ${REDIS_SENTINEL_CPUS:?Set REDIS_SENTINEL_CPUS for this host}
          memory: ${REDIS_SENTINEL_MEMORY:?Set REDIS_SENTINEL_MEMORY for this host}

  redis-sentinel-2:
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: ${REDIS_SENTINEL_CPUS:?Set REDIS_SENTINEL_CPUS for this host}
          memory: ${REDIS_SENTINEL_MEMORY:?Set REDIS_SENTINEL_MEMORY for this host}

  redis-sentinel-3:
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: ${REDIS_SENTINEL_CPUS:?Set REDIS_SENTINEL_CPUS for this host}
          memory: ${REDIS_SENTINEL_MEMORY:?Set REDIS_SENTINEL_MEMORY for this host}

  rabbitmq:
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set a strong RABBITMQ_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: ${RABBITMQ_CPUS:?Set RABBITMQ_CPUS for this host}
          memory: ${RABBITMQ_MEMORY:?Set RABBITMQ_MEMORY for this host}

  adminer:
    profiles: ["devtools"]
    ports: !reset []

  api:
    image: ${API_IMAGE:?Set API_IMAGE to a versioned image tag}
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-infracontrol};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:?Set POSTGRES_MAX_POOL_SIZE}"
      RabbitMQ__User: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      BootstrapAdmin__Enabled: ${PRODUCTION_BOOTSTRAP_ADMIN_ENABLED:-false}
      BootstrapAdmin__Email: ${PRODUCTION_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BootstrapAdmin__Password: ${PRODUCTION_BOOTSTRAP_ADMIN_PASSWORD:-}
    deploy:
      resources:
        limits:
          cpus: ${API_CPUS:?Set API_CPUS for this host}
          memory: ${API_MEMORY:?Set API_MEMORY for this host}

  workers:
    image: ${WORKERS_IMAGE:?Set WORKERS_IMAGE to a versioned image tag}
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-infracontrol};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};Maximum Pool Size=${POSTGRES_MAX_POOL_SIZE:?Set POSTGRES_MAX_POOL_SIZE}"
      RabbitMQ__User: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: ${WORKERS_CPUS:?Set WORKERS_CPUS for this host}
          memory: ${WORKERS_MEMORY:?Set WORKERS_MEMORY for this host}

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to a versioned image tag}
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      NGINX_HTTPS_PORT: ${HTTPS_PORT:-443}
      SEQ_AUTH_USER: ${SEQ_AUTH_USER:?Set SEQ_AUTH_USER}
      SEQ_AUTH_PASSWORD: ${SEQ_AUTH_PASSWORD:?Set a strong SEQ_AUTH_PASSWORD}
    volumes:
      - type: bind
        source: ${TLS_CERT_FILE:?Set TLS_CERT_FILE to a valid certificate file}
        target: /etc/nginx/ssl/server.crt
        read_only: true
      - type: bind
        source: ${TLS_KEY_FILE:?Set TLS_KEY_FILE to the matching private key file}
        target: /etc/nginx/ssl/server.key
        read_only: true
    deploy:
      resources:
        limits:
          cpus: ${FRONTEND_CPUS:?Set FRONTEND_CPUS for this host}
          memory: ${FRONTEND_MEMORY:?Set FRONTEND_MEMORY for this host}

  otel-collector:
    ports: !reset []

  ollama:
    ports: !reset []

  zabbix-db:
    ports: !reset []
