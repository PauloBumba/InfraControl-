# Prometheus do compose (profile `obs`). O scrape real acontece dentro do
# otel-collector (OTLP da app + exporters de infra) — aqui só há um alvo:
# o endpoint :8889 do collector, que já agrega tudo.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # honor_labels: o endpoint :8889 já expõe `job` por serviço
    # (InfraControl.Api, InfraControl.Workers, cadvisor, postgres...).
    # Sem isto o Prometheus sobrescreve tudo com job="otel-collector" e
    # a distinção API × Workers × exporters se perde no Grafana.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
