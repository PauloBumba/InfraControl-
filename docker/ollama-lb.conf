# Nginx load balancer para Ollama (3 réplicas)
# Round-robin com health check passivo: se uma réplica cair, o nginx
# marca como down e distribui para as outras.

events {
    worker_connections 1024;
}

http {
    upstream ollama_backend {
        # Round-robin entre as 3 réplicas do Ollama
        server ollama-1:11434 max_fails=3 fail_timeout=30s;
        server ollama-2:11434 max_fails=3 fail_timeout=30s;
        server ollama-3:11434 max_fails=3 fail_timeout=30s;

        # Keepalive connections para melhor performance
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Timeout adequado para inferência de LLM (pode levar segundos)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering otimizado para streaming de respostas
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://ollama_backend;
            proxy_http_version 1.1;

            # Headers para streaming e WebSocket (se necessário no futuro)
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Desabilitar buffering para permitir streaming de resposta
            proxy_buffering off;
            proxy_cache off;
        }

        # Health check específico do nginx
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
