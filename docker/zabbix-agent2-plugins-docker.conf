# F46-T007 — plugin Docker do Zabbix agent2.
# Montado em /etc/zabbix/zabbix_agent2.d/plugins.d/ (include_dir da imagem
# oficial). Habilita docker.containers.discovery (autodiscovery por container:
# CPU, memória, rede e I/O de cada serviço da stack InfraControl).
Plugins.Docker.Endpoint=unix:///var/run/docker.sock
