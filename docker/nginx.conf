user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # DNS do Docker Compose: necessário porque o serviço `seq` só existe no
    # profile `obs` — o bloco abaixo usa resolução dinâmica para o nginx não
    # falhar no boot quando o Seq está desligado (retorna 502 até subir).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---- Seq protegido por basic auth (ADR-022) ----------------------------
    # Rota externa da plataforma de logs. A porta 5341 publicada no host é a
    # do nginx (auth), NUNCA a do serviço Seq.
    server {
        listen 5341;

        auth_basic "InfraControl Seq";
        auth_basic_user_file /etc/nginx/seq.htpasswd;

        location / {
            set $seq_upstream http://seq:80;
            proxy_pass $seq_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- App: HTTP -> HTTPS -----------------------------------------------
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- App HTTPS (cookie da sessão é Secure; ADR-008/ADR-017) ------------
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        root  /usr/share/nginx/html;
        index index.html;

        # API: pass-through sem reescrita — o backend já serve em /api/v1/...
        # (mesma origem elimina o CORS; ADR-022). Resolução dinâmica (como no
        # bloco do Seq) para o nginx subir mesmo se `api` ainda não responde.
        location /api/ {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # SignalR (/hubs) precisa de Upgrade para WebSocket.
        location /hubs/ {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # SPA: cai no index.html para o React Router resolver a rota.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}