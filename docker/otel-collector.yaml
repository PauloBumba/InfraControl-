# Coletor OTel do compose (profile `obs`). Em homologação não há backend de
# tracing — recebe OTLP da API e despeja em console, deixando o pipeline OTel
# da aplicação validado de ponta a ponta sem derrubar o startup quando desligado.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]