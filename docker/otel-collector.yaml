# Coletor OTel do compose (profile `obs`). Recebe OTLP da API/Workers,
# faz scrape dos exporters de infraestrutura (cadvisor, postgres, redis,
# rabbitmq) e expõe TUDO num endpoint Prometheus (:8889) que o Prometheus
# raspa — um único ponto de agregação para o Grafana.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

  # Scrape Prometheus dos exporters de infra. Credenciais via ${env:...}
  # (o confmap do collector expande variáveis de ambiente).
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

        - job_name: cadvisor
          scrape_interval: 15s
          static_configs:
            - targets: ["cadvisor:8080"]

        - job_name: postgres
          scrape_interval: 15s
          static_configs:
            - targets: ["postgres-exporter:9187"]

        - job_name: redis
          scrape_interval: 15s
          static_configs:
            - targets: ["redis-exporter:9121"]

        # RabbitMQ 3.13+: métricas Prometheus vêm do plugin dedicado
        # rabbitmq_prometheus na porta 15692 (/metrics, sem auth).
        - job_name: rabbitmq
          scrape_interval: 15s
          static_configs:
            - targets: ["rabbitmq:15692"]

exporters:
  debug:
    verbosity: basic

  # Endpoint único que o Prometheus raspa (tudo que o collector conhece).
  prometheus:
    endpoint: 0.0.0.0:8889

  # Traces → Grafana Tempo (profile obs). OTLP/HTTP :4318.
  otlp_http/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp_http/tempo]
    metrics:
      receivers: [otlp, prometheus]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      exporters: [debug]
